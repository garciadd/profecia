# Máscaras binarias.
# mode = "include": la máscara indica las celdas que se conservan.
# mode = "exclude": la máscara indica las celdas que se eliminan.

[masks.binary.land]
label = "Tierra"
description = "Mantiene únicamente celdas terrestres y elimina océano."
mode = "include"
default = true
enabled = true

[masks.binary.ebf]
label = "Bosque tropical perenne"
description = "Excluye regiones evergreen broadleaf forest del dominio efectivo."
mode = "exclude"
default = false
enabled = true

[masks.binary.bs]
label = "Bare soil"
description = "Excluye regiones de suelo desnudo o vegetación escasa."
mode = "exclude"
default = false
enabled = true

#[masks.binary.deserts]
#label = "Desiertos"
#description = "Excluye regiones desérticas."
#mode = "exclude"
#default = false
#enabled = true

[masks.binary.snow_ice]
label = "Nieve y hielo"
description = "Excluye regiones cubiertas por nieve o hielo."
mode = "exclude"
default = false
enabled = true

# Máscaras categóricas.
# Sin clases seleccionadas = no se aplica ese filtro.
# Con clases seleccionadas = se conservan únicamente esas clases y se elimina el resto.

[masks.categorical.climate]
label = "Clima"
description = "Conserva únicamente las clases climáticas seleccionadas."
enabled = true
default_selected = []

[masks.categorical.climate.classes]
"1" = "Tropical"
"2" = "Árido"
"3" = "Templado"
"4" = "Frío"
"5" = "Polar"

[masks.categorical.landcover]
label = "Cobertura del suelo"
description = "Conserva únicamente las clases de cobertura seleccionadas."
enabled = true
default_selected = []

[masks.categorical.landcover.classes]
"10" = "Cropland"
"20" = "Forest"
"30" = "Grassland"
"40" = "Shrubland"
"70" = "Tundra"
"90" = "Barren"
"100" = "Snow/Ice"

[mlflow]
enabled = false
